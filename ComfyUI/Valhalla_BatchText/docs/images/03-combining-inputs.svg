<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1400" height="800" viewBox="0 0 1400 800"><title>Combining list and individual text inputs</title><desc>v1.5.1 joins values in socket order, not always TEXT_LIST first.</desc><defs><pattern id="grid" width="35" height="35" patternUnits="userSpaceOnUse"><path d="M35 0H0V35" fill="none" stroke="#273444" stroke-width="1"/></pattern></defs><rect width="1400" height="800" fill="#121922"/><rect width="1400" height="800" fill="url(#grid)"/><text x="53" y="75" fill="#f1f7ff" font-family="Segoe UI, Arial, sans-serif" font-weight="bold" font-size="43" text-anchor="start">Combining list and individual text inputs</text><text x="54" y="117" fill="#b5c9dc" font-family="Segoe UI, Arial, sans-serif" font-weight="normal" font-size="21" text-anchor="start">v1.5.1 joins values in socket order, not always TEXT_LIST first.</text><rect x="473" y="211" width="481" height="386" rx="15" fill="#262e39" stroke="#63758a" stroke-width="2"/><rect x="473" y="211" width="481" height="56" rx="13" fill="#343f4d" stroke="#63758a" stroke-width="2"/><text x="491" y="247" fill="#f7fbff" font-family="Segoe UI, Arial, sans-serif" font-weight="bold" font-size="26" text-anchor="start">Batch Text</text><text x="936" y="247" fill="#b9c9d7" font-family="Segoe UI, Arial, sans-serif" font-weight="normal" font-size="17" text-anchor="end">v1.5.1</text><circle cx="490" cy="306" r="9" fill="#54e69a"/><text x="511" y="313" fill="#e9f1fa" font-family="Segoe UI, Arial, sans-serif" font-weight="normal" font-size="22" text-anchor="start">TEXT:0</text><text x="898" y="313" fill="#cee5ff" font-family="Segoe UI, Arial, sans-serif" font-weight="bold" font-size="27" text-anchor="middle">↓</text><circle cx="490" cy="351" r="9" fill="#73bcff"/><text x="511" y="358" fill="#e9f1fa" font-family="Segoe UI, Arial, sans-serif" font-weight="normal" font-size="22" text-anchor="start">☷ TEXT_LIST</text><text x="855" y="358" fill="#cee5ff" font-family="Segoe UI, Arial, sans-serif" font-weight="bold" font-size="27" text-anchor="middle">↑</text><text x="898" y="358" fill="#cee5ff" font-family="Segoe UI, Arial, sans-serif" font-weight="bold" font-size="27" text-anchor="middle">↓</text><circle cx="490" cy="396" r="9" fill="#54e69a"/><text x="511" y="403" fill="#e9f1fa" font-family="Segoe UI, Arial, sans-serif" font-weight="normal" font-size="22" text-anchor="start">TEXT:1</text><text x="855" y="403" fill="#cee5ff" font-family="Segoe UI, Arial, sans-serif" font-weight="bold" font-size="27" text-anchor="middle">↑</text><text x="898" y="403" fill="#cee5ff" font-family="Segoe UI, Arial, sans-serif" font-weight="bold" font-size="27" text-anchor="middle">↓</text><circle cx="490" cy="441" r="9" fill="#54e69a"/><text x="511" y="448" fill="#e9f1fa" font-family="Segoe UI, Arial, sans-serif" font-weight="normal" font-size="22" text-anchor="start">TEXT:2 (free)</text><text x="855" y="448" fill="#cee5ff" font-family="Segoe UI, Arial, sans-serif" font-weight="bold" font-size="27" text-anchor="middle">↑</text><circle cx="938" cy="306" r="9" fill="#56ea9e"/><text x="920" y="312" fill="#e0eefa" font-family="Segoe UI, Arial, sans-serif" font-weight="normal" font-size="20" text-anchor="end">TEXT</text><rect x="490" y="512" width="447" height="43" rx="8" fill="#141e29" stroke="#4e6280" stroke-width="2"/><text x="505" y="540" fill="#adc0d8" font-family="Segoe UI, Arial, sans-serif" font-weight="normal" font-size="18" text-anchor="start">delimiter</text><text x="929" y="540" fill="#e9f3fa" font-family="Segoe UI, Arial, sans-serif" font-weight="normal" font-size="18" text-anchor="end">Pipe (|)</text><rect x="490" y="564" width="447" height="41" rx="8" fill="#192331" stroke="#4e6076" stroke-width="2"/><text x="713.5" y="592" fill="#d8e9fb" font-family="Segoe UI, Arial, sans-serif" font-weight="normal" font-size="19" text-anchor="middle">ⓘ  Info</text><rect x="56" y="228" width="373" height="151" rx="12" fill="#182634" stroke="#71C3FF" stroke-width="2"/><text x="75" y="265" fill="#F5FAFF" font-family="Segoe UI, Arial, sans-serif" font-weight="bold" font-size="22" text-anchor="start">Connected values</text><text x="75" y="294" fill="#bdcee0" font-family="Segoe UI, Arial, sans-serif" font-weight="normal" font-size="18" text-anchor="start">TEXT:0  =  A</text><text x="75" y="322" fill="#bdcee0" font-family="Segoe UI, Arial, sans-serif" font-weight="normal" font-size="18" text-anchor="start">TEXT_LIST = [L1, L2]</text><text x="75" y="350" fill="#bdcee0" font-family="Segoe UI, Arial, sans-serif" font-weight="normal" font-size="18" text-anchor="start">TEXT:1  =  B</text><rect x="998" y="270" width="358" height="122" rx="12" fill="#182634" stroke="#55E1A1" stroke-width="2"/><text x="1017" y="307" fill="#F5FAFF" font-family="Segoe UI, Arial, sans-serif" font-weight="bold" font-size="22" text-anchor="start">Inspector output</text><text x="1017" y="336" fill="#bdcee0" font-family="Segoe UI, Arial, sans-serif" font-weight="normal" font-size="18" text-anchor="start">A|L1|L2|B</text><text x="1017" y="364" fill="#bdcee0" font-family="Segoe UI, Arial, sans-serif" font-weight="normal" font-size="18" text-anchor="start">Top-to-bottom socket order.</text><path d="M429 320 C451.0 320 451.0 306 473 306" stroke="#70C6FF" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M954 306 C975.5 306 975.5 327 997 327" stroke="#63E3A9" stroke-width="4" fill="none" stroke-linecap="round"/><rect x="56" y="573" width="835" height="122" rx="12" fill="#182634" stroke="#B19CFA" stroke-width="2"/><text x="75" y="610" fill="#F5FAFF" font-family="Segoe UI, Arial, sans-serif" font-weight="bold" font-size="22" text-anchor="start">Reordering is real</text><text x="75" y="639" fill="#bdcee0" font-family="Segoe UI, Arial, sans-serif" font-weight="normal" font-size="18" text-anchor="start">Move TEXT_LIST between two TEXT sockets using ↑ / ↓.</text><text x="75" y="667" fill="#bdcee0" font-family="Segoe UI, Arial, sans-serif" font-weight="normal" font-size="18" text-anchor="start">The attached cables stay with their sources; the output changes.</text><text x="1350" y="772" fill="#8399ac" font-family="Segoe UI, Arial, sans-serif" font-weight="normal" font-size="15" text-anchor="end">Valhalla Batch Text v1.5.1  ·  © 2026 Werner de Jong  ·  MIT</text></svg>