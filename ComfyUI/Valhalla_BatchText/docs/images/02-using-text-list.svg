<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1400" height="800" viewBox="0 0 1400 800"><title>TEXT_LIST — native ComfyUI text lists</title><desc>A native list is joined into one STRING; it can now be moved with arrow controls.</desc><defs><pattern id="grid" width="35" height="35" patternUnits="userSpaceOnUse"><path d="M35 0H0V35" fill="none" stroke="#273444" stroke-width="1"/></pattern></defs><rect width="1400" height="800" fill="#121922"/><rect width="1400" height="800" fill="url(#grid)"/><text x="53" y="75" fill="#f1f7ff" font-family="Segoe UI, Arial, sans-serif" font-weight="bold" font-size="43" text-anchor="start">TEXT_LIST — native ComfyUI text lists</text><text x="54" y="117" fill="#b5c9dc" font-family="Segoe UI, Arial, sans-serif" font-weight="normal" font-size="21" text-anchor="start">A native list is joined into one STRING; it can now be moved with arrow controls.</text><rect x="460" y="214" width="510" height="296" rx="15" fill="#262e39" stroke="#63758a" stroke-width="2"/><rect x="460" y="214" width="510" height="56" rx="13" fill="#343f4d" stroke="#63758a" stroke-width="2"/><text x="478" y="250" fill="#f7fbff" font-family="Segoe UI, Arial, sans-serif" font-weight="bold" font-size="26" text-anchor="start">Batch Text</text><text x="952" y="250" fill="#b9c9d7" font-family="Segoe UI, Arial, sans-serif" font-weight="normal" font-size="17" text-anchor="end">v1.5.1</text><circle cx="477" cy="309" r="9" fill="#73bcff"/><text x="498" y="316" fill="#e9f1fa" font-family="Segoe UI, Arial, sans-serif" font-weight="normal" font-size="22" text-anchor="start">☷ TEXT_LIST</text><circle cx="477" cy="354" r="9" fill="#54e69a"/><text x="498" y="361" fill="#e9f1fa" font-family="Segoe UI, Arial, sans-serif" font-weight="normal" font-size="22" text-anchor="start">TEXT:0 (free)</text><circle cx="954" cy="309" r="9" fill="#56ea9e"/><text x="936" y="315" fill="#e0eefa" font-family="Segoe UI, Arial, sans-serif" font-weight="normal" font-size="20" text-anchor="end">TEXT</text><rect x="477" y="425" width="476" height="43" rx="8" fill="#141e29" stroke="#4e6280" stroke-width="2"/><text x="492" y="453" fill="#adc0d8" font-family="Segoe UI, Arial, sans-serif" font-weight="normal" font-size="18" text-anchor="start">delimiter</text><text x="945" y="453" fill="#e9f3fa" font-family="Segoe UI, Arial, sans-serif" font-weight="normal" font-size="18" text-anchor="end">LF (\n)</text><rect x="477" y="477" width="476" height="41" rx="8" fill="#192331" stroke="#4e6076" stroke-width="2"/><text x="715.0" y="505" fill="#d8e9fb" font-family="Segoe UI, Arial, sans-serif" font-weight="normal" font-size="19" text-anchor="middle">ⓘ  Info</text><rect x="65" y="265" width="330" height="122" rx="12" fill="#182634" stroke="#4CAEF7" stroke-width="2"/><text x="84" y="302" fill="#F5FAFF" font-family="Segoe UI, Arial, sans-serif" font-weight="bold" font-size="22" text-anchor="start">Native STRING list</text><text x="84" y="331" fill="#bdcee0" font-family="Segoe UI, Arial, sans-serif" font-weight="normal" font-size="18" text-anchor="start">Example list with 3 items:</text><text x="84" y="359" fill="#bdcee0" font-family="Segoe UI, Arial, sans-serif" font-weight="normal" font-size="18" text-anchor="start">face.png, body.png, outfit.png</text><rect x="1020" y="258" width="320" height="151" rx="12" fill="#182634" stroke="#57DEA2" stroke-width="2"/><text x="1039" y="295" fill="#F5FAFF" font-family="Segoe UI, Arial, sans-serif" font-weight="bold" font-size="22" text-anchor="start">One STRING output</text><text x="1039" y="324" fill="#bdcee0" font-family="Segoe UI, Arial, sans-serif" font-weight="normal" font-size="18" text-anchor="start">face.png</text><text x="1039" y="352" fill="#bdcee0" font-family="Segoe UI, Arial, sans-serif" font-weight="normal" font-size="18" text-anchor="start">body.png</text><text x="1039" y="380" fill="#bdcee0" font-family="Segoe UI, Arial, sans-serif" font-weight="normal" font-size="18" text-anchor="start">outfit.png</text><path d="M395 342 C427.5 342 427.5 309 460 309" stroke="#4CAEF7" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M970 309 C994.5 309 994.5 340 1019 340" stroke="#61E8AD" stroke-width="4" fill="none" stroke-linecap="round"/><rect x="465" y="564" width="506" height="122" rx="12" fill="#182634" stroke="#AE9CFE" stroke-width="2"/><text x="484" y="601" fill="#F5FAFF" font-family="Segoe UI, Arial, sans-serif" font-weight="bold" font-size="22" text-anchor="start">What is different?</text><text x="484" y="630" fill="#bdcee0" font-family="Segoe UI, Arial, sans-serif" font-weight="normal" font-size="18" text-anchor="start">A multiline STRING is one element.</text><text x="484" y="658" fill="#bdcee0" font-family="Segoe UI, Arial, sans-serif" font-weight="normal" font-size="18" text-anchor="start">TEXT_LIST expects native ComfyUI list semantics.</text><text x="1350" y="772" fill="#8399ac" font-family="Segoe UI, Arial, sans-serif" font-weight="normal" font-size="15" text-anchor="end">Valhalla Batch Text v1.5.1  ·  © 2026 Werner de Jong  ·  MIT</text></svg>