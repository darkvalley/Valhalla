<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1400" height="800" viewBox="0 0 1400 800"><title>Delimiter presets and Custom</title><desc>Separators include CR, LF, CRLF, blank lines and your own text.</desc><defs><pattern id="grid" width="35" height="35" patternUnits="userSpaceOnUse"><path d="M35 0H0V35" fill="none" stroke="#273444" stroke-width="1"/></pattern></defs><rect width="1400" height="800" fill="#121922"/><rect width="1400" height="800" fill="url(#grid)"/><text x="53" y="75" fill="#f1f7ff" font-family="Segoe UI, Arial, sans-serif" font-weight="bold" font-size="43" text-anchor="start">Delimiter presets and Custom</text><text x="54" y="117" fill="#b5c9dc" font-family="Segoe UI, Arial, sans-serif" font-weight="normal" font-size="21" text-anchor="start">Separators include CR, LF, CRLF, blank lines and your own text.</text><rect x="94" y="196" width="577" height="76" rx="10" fill="#202d3b" stroke="#4e6480" stroke-width="2"/><text x="118" y="229" fill="#f5f9ff" font-family="Segoe UI, Arial, sans-serif" font-weight="bold" font-size="21" text-anchor="start">None (direct)</text><text x="118" y="256" fill="#8de6fd" font-family="Segoe UI, Arial, sans-serif" font-weight="normal" font-size="18" text-anchor="start">AB</text><rect x="718" y="196" width="577" height="76" rx="10" fill="#202d3b" stroke="#4e6480" stroke-width="2"/><text x="742" y="229" fill="#f5f9ff" font-family="Segoe UI, Arial, sans-serif" font-weight="bold" font-size="21" text-anchor="start">Space ( )</text><text x="742" y="256" fill="#8de6fd" font-family="Segoe UI, Arial, sans-serif" font-weight="normal" font-size="18" text-anchor="start">A B</text><rect x="94" y="295" width="577" height="76" rx="10" fill="#202d3b" stroke="#4e6480" stroke-width="2"/><text x="118" y="328" fill="#f5f9ff" font-family="Segoe UI, Arial, sans-serif" font-weight="bold" font-size="21" text-anchor="start">Comma (, )</text><text x="118" y="355" fill="#8de6fd" font-family="Segoe UI, Arial, sans-serif" font-weight="normal" font-size="18" text-anchor="start">A, B</text><rect x="718" y="295" width="577" height="76" rx="10" fill="#202d3b" stroke="#4e6480" stroke-width="2"/><text x="742" y="328" fill="#f5f9ff" font-family="Segoe UI, Arial, sans-serif" font-weight="bold" font-size="21" text-anchor="start">Semicolon (; )</text><text x="742" y="355" fill="#8de6fd" font-family="Segoe UI, Arial, sans-serif" font-weight="normal" font-size="18" text-anchor="start">A; B</text><rect x="94" y="394" width="577" height="76" rx="10" fill="#202d3b" stroke="#4e6480" stroke-width="2"/><text x="118" y="427" fill="#f5f9ff" font-family="Segoe UI, Arial, sans-serif" font-weight="bold" font-size="21" text-anchor="start">Pipe (|)</text><text x="118" y="454" fill="#8de6fd" font-family="Segoe UI, Arial, sans-serif" font-weight="normal" font-size="18" text-anchor="start">A|B</text><rect x="718" y="394" width="577" height="76" rx="10" fill="#202d3b" stroke="#4e6480" stroke-width="2"/><text x="742" y="427" fill="#f5f9ff" font-family="Segoe UI, Arial, sans-serif" font-weight="bold" font-size="21" text-anchor="start">Tab (\t)</text><text x="742" y="454" fill="#8de6fd" font-family="Segoe UI, Arial, sans-serif" font-weight="normal" font-size="18" text-anchor="start">A⇥B</text><rect x="94" y="493" width="577" height="76" rx="10" fill="#202d3b" stroke="#4e6480" stroke-width="2"/><text x="118" y="526" fill="#f5f9ff" font-family="Segoe UI, Arial, sans-serif" font-weight="bold" font-size="21" text-anchor="start">LF (\n)</text><text x="118" y="553" fill="#8de6fd" font-family="Segoe UI, Arial, sans-serif" font-weight="normal" font-size="18" text-anchor="start">A↵B</text><rect x="718" y="493" width="577" height="76" rx="10" fill="#202d3b" stroke="#4e6480" stroke-width="2"/><text x="742" y="526" fill="#f5f9ff" font-family="Segoe UI, Arial, sans-serif" font-weight="bold" font-size="21" text-anchor="start">CRLF (\r\n)</text><text x="742" y="553" fill="#8de6fd" font-family="Segoe UI, Arial, sans-serif" font-weight="normal" font-size="18" text-anchor="start">A↵B</text><rect x="94" y="592" width="577" height="76" rx="10" fill="#202d3b" stroke="#4e6480" stroke-width="2"/><text x="118" y="625" fill="#f5f9ff" font-family="Segoe UI, Arial, sans-serif" font-weight="bold" font-size="21" text-anchor="start">Blank line (\n\n)</text><text x="118" y="652" fill="#8de6fd" font-family="Segoe UI, Arial, sans-serif" font-weight="normal" font-size="18" text-anchor="start">A↵↵B</text><rect x="718" y="592" width="577" height="76" rx="10" fill="#202d3b" stroke="#4e6480" stroke-width="2"/><text x="742" y="625" fill="#f5f9ff" font-family="Segoe UI, Arial, sans-serif" font-weight="bold" font-size="21" text-anchor="start">Custom</text><text x="742" y="652" fill="#8de6fd" font-family="Segoe UI, Arial, sans-serif" font-weight="normal" font-size="18" text-anchor="start">A + your text + B</text><text x="94" y="727" fill="#C0D0E2" font-family="Segoe UI, Arial, sans-serif" font-weight="normal" font-size="21" text-anchor="start">The chosen separator is inserted BETWEEN every joined element.</text><text x="1350" y="772" fill="#8399ac" font-family="Segoe UI, Arial, sans-serif" font-weight="normal" font-size="15" text-anchor="end">Valhalla Batch Text v1.5.1  ·  © 2026 Werner de Jong  ·  MIT</text></svg>