<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="850" viewBox="0 0 1440 850" role="img" aria-label="Delimiter presets"><title>Delimiter presets</title><desc>Select a separator, or choose Custom and enter any text.</desc><defs><pattern id="bg" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#243240" stroke-width="1"/></pattern><filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#000" flood-opacity=".32"/></filter></defs><rect width="1440" height="850" fill="#111820"/><rect width="1440" height="850" fill="url(#bg)"/><text x="54" y="83" font-size="46" fill="#F4F7FC" text-anchor="start" font-weight="700" font-family="Inter,Segoe UI,Arial,sans-serif">Delimiter presets</text><text x="56" y="130" font-size="23" fill="#A7BEDB" text-anchor="start" font-weight="400" font-family="Inter,Segoe UI,Arial,sans-serif">Select a separator, or choose Custom and enter any text.</text><rect x="100" y="207" width="1240" height="514" rx="16" fill="#202936" stroke="#526478" stroke-width="2"/><rect x="128" y="225" width="1184" height="52" rx="8" fill="#263345" stroke="#415369" stroke-width="2"/><text x="161" y="257" font-size="22" fill="#E9F1F9" text-anchor="start" font-weight="400" font-family="Inter,Segoe UI,Arial,sans-serif">None (direct)</text><text x="950" y="257" font-size="21" fill="#91D8FF" text-anchor="start" font-weight="400" font-family="Inter,Segoe UI,Arial,sans-serif">AB</text><rect x="128" y="287" width="1184" height="52" rx="8" fill="#1C2938" stroke="#415369" stroke-width="2"/><text x="161" y="319" font-size="22" fill="#E9F1F9" text-anchor="start" font-weight="400" font-family="Inter,Segoe UI,Arial,sans-serif">Space ( )</text><text x="950" y="319" font-size="21" fill="#91D8FF" text-anchor="start" font-weight="400" font-family="Inter,Segoe UI,Arial,sans-serif">A B</text><rect x="128" y="349" width="1184" height="52" rx="8" fill="#263345" stroke="#415369" stroke-width="2"/><text x="161" y="381" font-size="22" fill="#E9F1F9" text-anchor="start" font-weight="400" font-family="Inter,Segoe UI,Arial,sans-serif">Comma (, )</text><text x="950" y="381" font-size="21" fill="#91D8FF" text-anchor="start" font-weight="400" font-family="Inter,Segoe UI,Arial,sans-serif">A, B</text><rect x="128" y="411" width="1184" height="52" rx="8" fill="#1C2938" stroke="#415369" stroke-width="2"/><text x="161" y="443" font-size="22" fill="#E9F1F9" text-anchor="start" font-weight="400" font-family="Inter,Segoe UI,Arial,sans-serif">LF (\n)</text><text x="950" y="443" font-size="21" fill="#91D8FF" text-anchor="start" font-weight="400" font-family="Inter,Segoe UI,Arial,sans-serif">A ⏎ B</text><rect x="128" y="473" width="1184" height="52" rx="8" fill="#263345" stroke="#415369" stroke-width="2"/><text x="161" y="505" font-size="22" fill="#E9F1F9" text-anchor="start" font-weight="400" font-family="Inter,Segoe UI,Arial,sans-serif">CRLF (\r\n)</text><text x="950" y="505" font-size="21" fill="#91D8FF" text-anchor="start" font-weight="400" font-family="Inter,Segoe UI,Arial,sans-serif">A ↵ B</text><rect x="128" y="535" width="1184" height="52" rx="8" fill="#1C2938" stroke="#415369" stroke-width="2"/><text x="161" y="567" font-size="22" fill="#E9F1F9" text-anchor="start" font-weight="400" font-family="Inter,Segoe UI,Arial,sans-serif">Blank line (\n\n)</text><text x="950" y="567" font-size="21" fill="#91D8FF" text-anchor="start" font-weight="400" font-family="Inter,Segoe UI,Arial,sans-serif">A ↵ ↵ B</text><rect x="128" y="597" width="1184" height="52" rx="8" fill="#263345" stroke="#415369" stroke-width="2"/><text x="161" y="629" font-size="22" fill="#E9F1F9" text-anchor="start" font-weight="400" font-family="Inter,Segoe UI,Arial,sans-serif">Custom</text><text x="950" y="629" font-size="21" fill="#91D8FF" text-anchor="start" font-weight="400" font-family="Inter,Segoe UI,Arial,sans-serif">A [your separator] B</text><text x="161" y="751" font-size="20" fill="#D0C3FA" text-anchor="start" font-weight="400" font-family="Inter,Segoe UI,Arial,sans-serif">Escape sequences supported in Custom:  \n  \r  \t  \\</text><text x="1392" y="819" font-size="16" fill="#8294A8" text-anchor="end" font-weight="400" font-family="Inter,Segoe UI,Arial,sans-serif">Valhalla Batch Text  •  © 2026 Werner de Jong  •  MIT License</text></svg>