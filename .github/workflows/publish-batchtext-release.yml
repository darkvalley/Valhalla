name: Publish Batch Text v1.5.3 release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-batchtext-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the verified v1.5.3 code
        uses: actions/checkout@v4
        with:
          ref: f07b680ccd293f396d5ee3d62925391f449e9086
          persist-credentials: false

      - name: Build ComfyUI custom-node archive
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED

          source = Path('ComfyUI/Valhalla_BatchText')
          archive = Path('Valhalla_BatchText_v1.5.3.zip')
          with ZipFile(archive, 'w', ZIP_DEFLATED, compresslevel=9) as target:
              for path in sorted(source.rglob('*')):
                  if not path.is_file():
                      continue
                  if '__pycache__' in path.parts or path.suffix == '.pyc':
                      continue
                  target.write(path, Path('Valhalla_BatchText') / path.relative_to(source))
          print(f'Built {archive}: {archive.stat().st_size} bytes')
          PY

      - name: Publish version tag and GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view 'v1.5.3' --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo 'Release v1.5.3 already exists; no changes made.'
            exit 0
          fi
          gh release create 'v1.5.3' \
            './Valhalla_BatchText_v1.5.3.zip#Valhalla Batch Text v1.5.3 - ComfyUI custom node' \
            --repo "${GITHUB_REPOSITORY}" \
            --target 'f07b680ccd293f396d5ee3d62925391f449e9086' \
            --title 'Valhalla Batch Text v1.5.3 — Cable Follow Fix' \
            --notes-file 'ComfyUI/Valhalla_BatchText/RELEASE_NOTES_v1.5.3.md' \
            --latest
