name: Publish Batch Text v1.6.3 release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-batchtext-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: valhalla-batch-text-v1.6.3-release
  cancel-in-progress: false

jobs:
  publish-release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out approved stable v1.6.3 code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify approved stable code and version
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object ComfyUI/Valhalla_BatchText/__init__.py)" = "189981f4670687863bad4b01c547e3a917e4aa78"
          test "$(git hash-object ComfyUI/Valhalla_BatchText/batch_text.py)" = "c2b715e3db89ba9cbef78ce4341944d32c492a82"
          test "$(git hash-object ComfyUI/Valhalla_BatchText/web/js/batch_text.js)" = "86a8836a469edea54085b3f494b421083d280ad3"
          test "$(git hash-object ComfyUI/Valhalla_BatchText/web/js/batch_text_inspector.js)" = "ada8850ced94d40d6f2679e58e690a9c7dbd273b"
          test "$(git hash-object ComfyUI/Valhalla_BatchText/pyproject.toml)" = "740fde2f4f4592845bd8dd445fe9a7103cff17d0"
          test "$(git hash-object ComfyUI/Valhalla_BatchText/RELEASE_NOTES_v1.6.3.md)" = "d88e0c318429ebe39b1be1aff79164df2c887007"
          grep -Fxq 'version = "1.6.3"' ComfyUI/Valhalla_BatchText/pyproject.toml
          grep -Fq 'function sourceOutputLabel(node, slot)' ComfyUI/Valhalla_BatchText/web/js/batch_text.js
          grep -Fq 'function saveLogFolder(node, data)' ComfyUI/Valhalla_BatchText/web/js/batch_text_inspector.js

      - name: Run Python regression tests
        run: python -m unittest discover -s ComfyUI/Valhalla_BatchText/tests -p "test_*.py" -v

      - name: Run all four JavaScript regression suites and syntax checks
        shell: bash
        run: |
          set -euo pipefail
          node --check ComfyUI/Valhalla_BatchText/web/js/batch_text.js
          node --check ComfyUI/Valhalla_BatchText/web/js/batch_text_inspector.js
          node ComfyUI/Valhalla_BatchText/tests/test_dynamic_ui.cjs
          node ComfyUI/Valhalla_BatchText/tests/test_order_persistence.cjs
          node ComfyUI/Valhalla_BatchText/tests/test_inspector_integrated_ui.cjs
          node ComfyUI/Valhalla_BatchText/tests/test_inspector_ui.cjs

      - name: Build and verify installable custom-node ZIP
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED

          source = Path("ComfyUI/Valhalla_BatchText")
          archive = Path("Valhalla_BatchText_v1.6.3.zip")
          essential = {
              "__init__.py", "batch_text.py", "web/js/batch_text.js",
              "web/js/batch_text_inspector.js", "README.md", "LICENSE",
              "pyproject.toml", "RELEASE_NOTES_v1.6.3.md"
          }
          assert all((source / p).is_file() for p in essential), "Required files missing"
          with ZipFile(archive, "w", ZIP_DEFLATED, compresslevel=9) as output:
              for path in sorted(source.rglob("*")):
                  relative = path.relative_to(source)
                  if (not path.is_file() or "tests" in relative.parts
                      or "__pycache__" in relative.parts or path.suffix == ".pyc"):
                      continue
                  output.write(path, Path("Valhalla_BatchText") / relative)
          with ZipFile(archive) as verify:
              files = set(verify.namelist())
              assert verify.testzip() is None, "Corrupt ZIP"
          missing = {f"Valhalla_BatchText/{p}" for p in essential} - files
          assert not missing, f"Missing archive entries: {sorted(missing)}"
          print(f"Verified {archive}: {archive.stat().st_size} bytes, {len(files)} files")
          PY

      - name: Create official version tag and GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view 'v1.6.3' --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo 'Release v1.6.3 already exists; leaving it unchanged.'
            exit 0
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v1.6.3" >/dev/null 2>&1; then
            echo '::error::Tag v1.6.3 exists without a release; verify its target before publishing.'
            exit 1
          fi
          gh release create 'v1.6.3' \
            './Valhalla_BatchText_v1.6.3.zip#Valhalla Batch Text v1.6.3 - ComfyUI custom node' \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title 'Valhalla Batch Text v1.6.3 — Daily Logging and Persistent Port Labels' \
            --notes-file 'ComfyUI/Valhalla_BatchText/RELEASE_NOTES_v1.6.3.md' \
            --latest
