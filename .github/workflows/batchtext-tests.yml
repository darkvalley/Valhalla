name: Batch Text tests

on:
  push:
    paths:
      - 'ComfyUI/Valhalla_BatchText/**'
      - '.github/workflows/batchtext-tests.yml'
  pull_request:
    paths:
      - 'ComfyUI/Valhalla_BatchText/**'
      - '.github/workflows/batchtext-tests.yml'

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python unit tests (including socket order)
        run: python -m unittest discover -s ComfyUI/Valhalla_BatchText/tests -p 'test_*.py' -v
      - name: Simulated ComfyUI frontend UI tests
        run: node ComfyUI/Valhalla_BatchText/tests/test_dynamic_ui.cjs
      - name: Saved-port-order restart and reload regression
        run: node ComfyUI/Valhalla_BatchText/tests/test_order_persistence.cjs
      - name: JavaScript syntax
        run: node --check ComfyUI/Valhalla_BatchText/web/js/batch_text.js
