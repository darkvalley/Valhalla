name: Batch Text tests

on:
  push:
    paths:
      - 'ComfyUI/Valhalla_BatchText/**'
      - '.github/workflows/batchtext-tests.yml'
  pull_request:
    paths:
      - 'ComfyUI/Valhalla_BatchText/**'
      - '.github/workflows/batchtext-tests.yml'

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python tests
        run: python -m unittest discover -s ComfyUI/Valhalla_BatchText/tests -p test_batch_text.py -v
      - name: Simulated UI tests
        run: node ComfyUI/Valhalla_BatchText/tests/test_dynamic_ui.cjs
