name: Publish Valhalla Batch Text to Comfy Registry

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out approved stable code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run Python regression tests
        run: python -m unittest discover -s ComfyUI/Valhalla_BatchText/tests -p "test_*.py" -v

      - name: Run JavaScript regression tests
        run: |
          node --check ComfyUI/Valhalla_BatchText/web/js/batch_text.js
          node ComfyUI/Valhalla_BatchText/tests/test_dynamic_ui.cjs
          node ComfyUI/Valhalla_BatchText/tests/test_order_persistence.cjs

      - name: Check publishing credentials
        env:
          REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
        run: |
          if [ -z "$REGISTRY_ACCESS_TOKEN" ]; then
            echo "::error::Create a repository secret named REGISTRY_ACCESS_TOKEN with your Comfy Registry Publishing API Key."
            exit 1
          fi

      - name: Install publishing tools
        run: python -m pip install comfy-cli ruff

      - name: Initialize Comfy CLI without prompts
        run: comfy --skip-prompt --no-enable-telemetry env

      - name: Validate registry metadata and security
        working-directory: ComfyUI/Valhalla_BatchText
        run: comfy node validate

      - name: Package only Valhalla Batch Text
        working-directory: ComfyUI/Valhalla_BatchText
        run: comfy node pack

      - name: Verify Registry archive contents
        working-directory: ComfyUI/Valhalla_BatchText
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          archives = list(Path(".").glob("*.zip"))
          assert len(archives) == 1, f"Expected exactly one package ZIP, found: {archives}"
          with ZipFile(archives[0]) as archive:
              names = set(archive.namelist())
          required = {"__init__.py", "batch_text.py", "web/js/batch_text.js", "pyproject.toml", "LICENSE", "README.md"}
          assert required <= names, f"Missing files: {sorted(required - names)}"
          assert not any(name.startswith(("tests/", "ComfyUI/", ".github/")) for name in names), "Unexpected source or test folders"
          print(f"Verified {archives[0]}: {len(names)} files, only the custom node payload")
          PY

      - name: Publish the approved stable version
        working-directory: ComfyUI/Valhalla_BatchText
        env:
          REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
        run: |
          comfy node publish \
            --token "$REGISTRY_ACCESS_TOKEN" \
            --changelog-file RELEASE_NOTES_v1.5.4.md
